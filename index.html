<!doctype html>
<html lang="en">
  <head>
    <!-- UTF-8 is required so the peso sign (₱) and emojis display correctly -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Cafeteria POS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <div class="header-inner">
        <span class="brand-icon" aria-hidden="true">🍽️</span>
        <div>
          <h1>Campus Cafeteria POS</h1>
          <p>Walk-up Lunch Ordering System</p>
        </div>
      </div>
    </header>

    <!-- ===== MAIN LAYOUT ===== -->
    <main class="layout">
      <!-- SECTION 1: PRODUCTS -->
      <section class="panel section-products" id="products-section">
        <div class="section-header">
          <span class="step">1</span>
          <h2>Menu</h2>
        </div>

        <!-- Product cards are created by renderProducts() in script.js -->
        <div class="product-grid" id="product-grid"></div>
      </section>

      <!-- SECTION 2: CART & ORDER SUMMARY -->
      <section class="panel section-cart" id="cart-section">
        <div class="section-header">
          <span class="step">2</span>
          <h2>Cart &amp; Order Summary</h2>
        </div>

        <!-- Cart messages (e.g. "Pork Adobo added to cart.") appear here -->
        <p id="cart-message" class="message"></p>

        <table class="cart-table">
          <thead>
            <tr>
              <th>Item</th>
              <th class="num">Unit Price</th>
              <th class="center">Quantity</th>
              <th class="num">Subtotal</th>
              <th class="center">Action</th>
            </tr>
          </thead>
          <!-- Rows are drawn by renderCart() in script.js -->
          <tbody id="cart-body"></tbody>
        </table>

        <div class="total-box">
          <span class="total-label">TOTAL AMOUNT DUE</span>
          <span id="total-amount" class="total-value">₱0.00</span>
        </div>
      </section>

      <!-- SECTION 3: PAYMENT & RECEIPT -->
      <section class="panel section-payment" id="payment-section">
        <div class="section-header">
          <span class="step">3</span>
          <h2>Payment &amp; Receipt</h2>
        </div>

        <div class="payment-layout">
          <!-- Payment form -->
          <div class="payment-form">
            <label for="cash-input">Amount Paid (Cash)</label>
            <div class="input-wrap">
              <span class="input-prefix" aria-hidden="true">₱</span>
              <input
                type="number"
                id="cash-input"
                min="0"
                step="0.01"
                placeholder="0.00"
              />
            </div>

            <!-- Payment errors (red) and success messages (green) appear here -->
            <p id="payment-message" class="message"></p>

            <button
              type="button"
              id="confirm-payment-btn"
              class="btn btn-success btn-block"
            >
              Confirm Payment
            </button>
            <button
              type="button"
              id="new-transaction-btn"
              class="btn btn-neutral btn-block"
            >
              New Transaction
            </button>
          </div>

          <!-- Confirmation and receipt -->
          <div class="receipt-area">
            <!-- Filled by renderConfirmation() after payment -->
            <div id="payment-confirmation"></div>
            <!-- Filled by renderReceipt() after payment -->
            <div id="receipt-content"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Script is loaded at the end so the HTML elements exist first -->
    <script src="script.js"></script>
  </body>
</html>
